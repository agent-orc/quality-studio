schemaVersion: 1
stack: [dotnet, node, playwright]
toolVersions:
  node: .nvmrc
  dotnetSdk: global.json
commands:
  prepare: .agent-studio/prepare
  build:
    # Restores by itself: a review cache hit skips prepare, and the cached obj folders
    # name the NuGet folder of an earlier attempt.
    - dotnet build QualityStudio.slnx
    - npm --prefix frontend run build
  test:
    # Covers both GitHub lanes (portable and controlled tool-bound). This host disables MSBuild node
    # reuse, so lingering build servers stay invisible here; unit tests pin --disable-build-servers.
    - dotnet test QualityStudio.slnx --filter "Category!=MachineBound&Category!=ExternalLive"
    # Chrome keeps its singleton socket under TMPDIR, and the review temp path exceeds
    # the length limit of a Unix socket path.
    - TMPDIR=/tmp .agent-studio/test-frontend
  lint:
    - .agent-studio/lint
    # The same checks the GitHub Build workflow runs before its .NET lanes; without them a
    # formatting or test-lane contract violation passes the gates and turns main red.
    - dotnet format QualityStudio.slnx --verify-no-changes
    - npm run test:repository-contracts
testSuites:
  - id: backend-routine
    category: routine
    expectedDurationSeconds: 497
    command: dotnet test QualityStudio.slnx --filter "Category!=MachineBound&Category!=ExternalLive"
  - id: backend-machine-bound
    category: machine-bound
    expectedDurationSeconds: 23
    command: dotnet test QualityStudio.slnx --no-build --filter Category=MachineBound
  - id: frontend-unit
    category: routine
    expectedDurationSeconds: 35
    command: TMPDIR=/tmp .agent-studio/test-frontend
cachePaths:
  - frontend/node_modules
capabilities: [git, child-process, loopback-network]
environment:
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  CHROME_NO_SANDBOX: "1"
  # The dev launcher starts QualityStudio.Api with backend/QualityStudio.Api as
  # its content root. This resolves to the checkout root from that directory.
  QualityStudio__AllowedRoots__0: ../..
devServer:
  # npm start launches the API at 127.0.0.1:5127 and Angular at 127.0.0.1:4200.
  # The API receives QualityStudio__AllowedRoots__0 from environment above.
  command: npm start
  workingDirectory: .
  healthUrl: http://127.0.0.1:4200
  startupTimeoutSeconds: 120
  stopWithRun: true
