schemaVersion: 1
stack: [dotnet, node]
toolVersions:
  node: .nvmrc
  dotnetSdk: global.json
commands:
  prepare: .agent-studio/prepare
  build:
    - dotnet build QualityStudio.slnx --no-restore
    - npm --prefix frontend run build
  test:
    - dotnet test QualityStudio.slnx --filter "Category!=MachineBound&Category!=ExternalLive"
    - npm --prefix frontend run test
  lint:
    - npm --prefix frontend run lint
testSuites:
  - id: backend-routine
    category: routine
    expectedDurationSeconds: 640
    command: dotnet test QualityStudio.slnx --filter "Category!=MachineBound&Category!=ExternalLive"
  - id: backend-machine-bound
    category: machine-bound
    expectedDurationSeconds: 30
    command: dotnet test QualityStudio.slnx --no-build --filter Category=MachineBound
  - id: frontend-unit
    category: routine
    expectedDurationSeconds: 27
    command: npm --prefix frontend run test
cachePaths:
  - frontend/node_modules
capabilities: [git, child-process, loopback-network]
environment:
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  CHROME_NO_SANDBOX: "1"
  # The dev stack starts dotnet from the repository root. The API resolves this
  # value from that content root, allowing its seeded repository and sibling checkouts.
  QualityStudio__AllowedRoots__0: ../..
devServer:
  command: npm start
  workingDirectory: .
  healthUrl: http://127.0.0.1:4200
  startupTimeoutSeconds: 120
  stopWithRun: true
