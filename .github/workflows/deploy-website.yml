name: publish-website-reference

# Exports the product reference page to this repository's "deploy" branch.
# The public /quality/ site is published separately from quality-studio-website
# on main. This export does not update that live site; see website/DEPLOY.md.
# The exported page is static HTML with relative links.
on:
  push:
    branches: [ main ]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  publish-deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish reference website to product deploy branch
        run: |
          cd website
          git init -b deploy
          git config user.name "deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
