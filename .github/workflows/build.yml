name: Required gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable build, test, coverage, and security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHROME_NO_SANDBOX: "1"
      COVERAGE_ROOT: ${{ runner.temp }}/quality-studio-coverage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Test coverage and release-canary contracts
        run: npm run test:repository-contracts

      - name: Restore locked .NET dependencies
        run: dotnet restore QualityStudio.slnx --locked-mode

      - name: Build Release solution
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test core and CLI without machine-bound checks
        run: >-
          dotnet test tests/AgentOrchestrator.CodeQuality.Tests/AgentOrchestrator.CodeQuality.Tests.csproj
          --configuration Release --no-build --filter "Category!=MachineBound"
          --collect:"XPlat Code Coverage" --results-directory "$COVERAGE_ROOT/core"

      - name: Test API without machine-bound checks
        run: >-
          dotnet test tests/QualityStudio.Api.Tests/QualityStudio.Api.Tests.csproj
          --configuration Release --no-build --filter "Category!=MachineBound"
          --collect:"XPlat Code Coverage" --results-directory "$COVERAGE_ROOT/api"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Provision pinned Playwright Chromium
        working-directory: frontend
        run: npm run browser:install -- --with-deps

      - name: Test browser binary resolution
        working-directory: frontend
        run: npm run test:browser-resolver

      - name: Build production Angular bundle
        working-directory: frontend
        run: npm run build

      - name: Test Angular and generate lcov
        working-directory: frontend
        env:
          COVERAGE_DIR: ${{ runner.temp }}/quality-studio-coverage/frontend
        run: npm run test:coverage

      - name: Enforce measured coverage ratchet
        run: >-
          node scripts/check-coverage.mjs
          --baseline .quality/coverage-baseline.json
          --cobertura core="$COVERAGE_ROOT/core"
          --cobertura api="$COVERAGE_ROOT/api"
          --lcov frontend="$COVERAGE_ROOT/frontend/lcov.info"

      - name: Provision pinned Gitleaks
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security provision

      - name: Scan repository with pinned Gitleaks
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security scan .

      - name: Publish coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-gate-coverage
          path: ${{ runner.temp }}/quality-studio-coverage
          if-no-files-found: error
          retention-days: 14

  host-integration:
    name: Host integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Test dev-stack process, port, and readiness contract
        run: npm run test:dev-stack
