name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Test coverage report validator
        run: python3 .github/scripts/test_validate_coverage.py

      - name: Restore
        run: dotnet restore QualityStudio.slnx

      - name: Build
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test QualityStudio.slnx
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Validate .NET coverage reports
        run: >-
          python3 .github/scripts/validate_coverage.py
          --format cobertura
          --report "tests/AgentOrchestrator.CodeQuality.Tests/TestResults/**/coverage.cobertura.xml"
          --report "tests/QualityStudio.Api.Tests/TestResults/**/coverage.cobertura.xml"

      - name: Upload AgentOrchestrator.CodeQuality coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-agent-orchestrator-code-quality
          path: tests/AgentOrchestrator.CodeQuality.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload QualityStudio.Api coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-quality-studio-api
          path: tests/QualityStudio.Api.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Pack analysis core
        run: >-
          dotnet pack src/AgentOrchestrator.CodeQuality/AgentOrchestrator.CodeQuality.csproj
          --configuration Release
          --no-build
          --output artifacts/nuget

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Security scan
        run: dotnet run --project src/quality-cli -- security scan .

      - name: NuGet vulnerable package check (solution)
        run: |
          set -euo pipefail
          dotnet list QualityStudio.slnx package --vulnerable --include-transitive --format json > nuget-vulnerable-solution.json
          cat nuget-vulnerable-solution.json
          if jq -e '.projects[]? | select(.frameworks != null)' nuget-vulnerable-solution.json >/dev/null; then
            echo "::error::Vulnerable NuGet packages found in the solution. See output above."
            exit 1
          fi

      - name: NuGet vulnerable package check (code-graph spike)
        run: |
          set -euo pipefail
          dotnet restore spikes/code-graph/CodeGraphSpike.csproj
          dotnet list spikes/code-graph/CodeGraphSpike.csproj package --vulnerable --include-transitive --format json > nuget-vulnerable-spike.json
          cat nuget-vulnerable-spike.json
          if jq -e '.projects[]? | select(.frameworks != null)' nuget-vulnerable-spike.json >/dev/null; then
            echo "::error::Vulnerable NuGet packages found in the code-graph spike. See output above."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Validate Angular coverage report
        run: >-
          python3 .github/scripts/validate_coverage.py
          --format lcov
          --report "frontend/coverage/lcov.info"

      - name: Upload Angular coverage
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend full dependency tree audit (advisory, dev tooling included)
        working-directory: frontend
        run: npm audit || true
