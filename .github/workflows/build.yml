name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Restore
        run: dotnet restore QualityStudio.slnx

      - name: Build
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test (portable)
        run: >-
          dotnet test QualityStudio.slnx
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Provision pinned Chromium
        run: npm run browser:install
        working-directory: frontend

      - name: Test frontend fixtures
        run: npm run test:unit
        working-directory: frontend

      - name: Build frontend (production)
        run: npm run build
        working-directory: frontend

      - name: Test frontend (Angular)
        run: npm test
        working-directory: frontend
        env:
          CHROME_NO_SANDBOX: "1"

      - name: Security scan
        run: dotnet run --project src/quality-cli -- security scan .
