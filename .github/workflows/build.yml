name: Required gate

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable product gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHROME_NO_SANDBOX: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned .NET 10.0.301
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Set up pinned Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test required-gate workflow contract
        run: npm run test:required-gate

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Restore .NET dependencies
        run: dotnet restore QualityStudio.slnx

      - name: Build Release product
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test portable .NET product
        run: >-
          dotnet test QualityStudio.slnx
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Provision pinned Playwright Chromium
        working-directory: frontend
        run: npm run browser:install -- --with-deps

      - name: Test browser binary resolution
        working-directory: frontend
        run: npm run test:browser-resolver

      - name: Build production Angular product
        working-directory: frontend
        run: npm run build

      - name: Test Angular product
        working-directory: frontend
        run: npm test

      - name: Provision and verify pinned Gitleaks 8.24.2
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security provision

      - name: Run repository security gate
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security scan .
