name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Restore
        run: dotnet restore QualityStudio.slnx

      - name: Build
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test QualityStudio.slnx
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"

      - name: Security scan
        run: dotnet run --project src/quality-cli -- security scan .

      - name: .NET dependency advisories (solution and out-of-solution spike)
        run: |
          set -o pipefail
          dotnet list QualityStudio.slnx package --vulnerable --include-transitive | tee nuget-vulnerable.txt
          dotnet list spikes/code-graph/CodeGraphSpike.csproj package --vulnerable --include-transitive | tee -a nuget-vulnerable.txt
          if grep -q "has the following vulnerable packages" nuget-vulnerable.txt; then
            echo "::error::Vulnerable NuGet package(s) detected; see the step log above."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Frontend unit tests
        env:
          CHROME_NO_SANDBOX: "1"
        run: npm --prefix frontend test

      - name: Frontend dependency advisories (production, fails on high/critical)
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Frontend dependency advisories (full tree, informational)
        if: always()
        run: npm --prefix frontend audit --json > frontend-npm-audit-full.json || true

      - name: Upload dependency advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-advisories-${{ github.run_id }}
          path: |
            nuget-vulnerable.txt
            frontend-npm-audit-full.json
          if-no-files-found: warn
