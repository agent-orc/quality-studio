name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the Prettier changed-file gate can diff against origin/main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Lint (repository-owned scripts + Angular/TypeScript, baselined)
        run: npm run style:eslint:check

      - name: Prettier format gate (changed frontend files only)
        run: npm run style:frontend:check

      - name: Restore
        run: dotnet restore QualityStudio.slnx

      - name: Build
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: .NET whitespace gate (baselined)
        run: npm run style:dotnet:check

      - name: Test
        run: >-
          dotnet test QualityStudio.slnx
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"

      - name: Security scan
        run: dotnet run --project src/quality-cli -- security scan .
