name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable build, test, coverage, and security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Restore .NET dependencies
        run: dotnet restore QualityStudio.slnx

      - name: Build .NET Release
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test portable core and CLI with Cobertura
        run: >-
          dotnet test tests/AgentOrchestrator.CodeQuality.Tests/AgentOrchestrator.CodeQuality.Tests.csproj
          --configuration Release --no-build --filter "Category!=MachineBound"
          --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/core

      - name: Test portable API with Cobertura
        run: >-
          dotnet test tests/QualityStudio.Api.Tests/QualityStudio.Api.Tests.csproj
          --configuration Release --no-build --filter "Category!=MachineBound"
          --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/api

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Provision pinned Playwright Chromium
        working-directory: frontend
        run: npx playwright-core install --with-deps chromium

      - name: Build production Angular bundle
        working-directory: frontend
        run: npm run build

      - name: Test Angular with lcov
        working-directory: frontend
        env:
          CHROME_NO_SANDBOX: "1"
        run: npm run test:coverage

      - name: Enforce measured coverage ratchet
        run: npm run coverage:check

      - name: Provision pinned Gitleaks and run security scan
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security scan .

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          if-no-files-found: error
          path: |
            artifacts/coverage/**/coverage.cobertura.xml
            frontend/coverage/frontend/lcov.info
            frontend/coverage/frontend/cobertura-coverage.xml

  host-integration:
    name: Host integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Test developer stack launcher
        run: npm run test:dev-stack
