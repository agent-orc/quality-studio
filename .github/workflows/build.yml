name: Required baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable product gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore locked .NET dependencies
        run: dotnet restore QualityStudio.slnx --locked-mode

      - name: Build Release
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test portable core and collect Cobertura
        run: >-
          dotnet test tests/AgentOrchestrator.CodeQuality.Tests/AgentOrchestrator.CodeQuality.Tests.csproj
          --configuration Release --no-build
          --filter "Category!=MachineBound&Category!=ExternalLive"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/dotnet-core
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Test portable API and collect Cobertura
        run: >-
          dotnet test tests/QualityStudio.Api.Tests/QualityStudio.Api.Tests.csproj
          --configuration Release --no-build
          --filter "Category!=MachineBound&Category!=ExternalLive"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/dotnet-api
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Provision pinned Playwright Chromium
        working-directory: frontend
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Build production frontend within budget
        working-directory: frontend
        run: npm run build

      - name: Test Angular and collect lcov
        working-directory: frontend
        env:
          CHROME_NO_SANDBOX: '1'
        run: npm run test:coverage

      - name: Verify baseline support contracts
        run: node --test tests/coverage-ratchet.test.mjs frontend/tests/browser-binary.test.mjs

      - name: Enforce measured coverage ratchet
        run: node scripts/coverage-ratchet.mjs

      - name: Run real-API browser journey
        working-directory: frontend
        env:
          JOB_RESULTS_DIR: ${{ github.workspace }}/artifacts/real-api-smoke
        run: npm run test:real-api

      - name: Provision pinned Gitleaks
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security provision

      - name: Scan repository with pinned Gitleaks
        run: dotnet run --project src/quality-cli --configuration Release --no-build -- security scan .

      - name: Publish coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portable-baseline-evidence
          path: |
            artifacts/coverage
            artifacts/real-api-smoke
            frontend/coverage/frontend/lcov.info
          if-no-files-found: warn

  host-integration:
    name: Dev stack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Test launcher with isolated ports and fixtures
        run: npm run test:dev-stack
