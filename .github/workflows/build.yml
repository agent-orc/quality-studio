name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CHROME_NO_SANDBOX: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Token Economy model catalog snapshot
        run: npm run catalog:check

      - name: Restore
        run: dotnet restore QualityStudio.slnx

      - name: Build
        run: dotnet build QualityStudio.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test QualityStudio.slnx
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build production Angular bundle
        run: npm --prefix frontend run build

      - name: Provision pinned Chromium
        run: npm --prefix frontend run browser:install

      - name: Test frontend tooling
        run: npm --prefix frontend run test:tooling

      - name: Test Angular
        run: npm --prefix frontend test

      - name: Security scan
        run: dotnet run --project src/quality-cli -- security scan .
