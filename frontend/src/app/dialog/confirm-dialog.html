<div class="dialog-backdrop confirm-backdrop" qsModalBackdrop (dismiss)="cancelled.emit()">
  <section class="confirm-dialog" qsModal (dismiss)="cancelled.emit()" role="dialog" aria-modal="true"
    aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
    <header>
      <span class="eyebrow">{{ eyebrow() }}</span>
      <h2 id="confirm-dialog-title">{{ heading() }}</h2>
    </header>
    <p id="confirm-dialog-message">{{ message() }}</p>
    <footer>
      <span class="footer-spacer"></span>
      <button class="secondary-button" type="button" data-modal-autofocus (click)="cancelled.emit()">Cancel</button>
      <button type="button" [class]="danger() ? 'danger-button' : 'primary-button'" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
    </footer>
  </section>
</div>
