title = "Quality Studio Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Generated build output is not scanned for secret findings. Persisted review output under .quality/reviews IS scanned: it can echo repository secrets into review metadata, so it must not be a blanket exclusion (dossier F-04)."
paths = [
  '''(^|/)bin(/|$)''',
  '''(^|/)obj(/|$)''',
  '''(^|/)dist(/|$)''',
  '''(^|/)coverage(/|$)''',
  '''(^|/)node_modules(/|$)''',
  '''(^|/)\.angular(/|$)''',
  '''(^|/)\.quality/security(/|$)''',
]

# Value-exact allowlist for documented fixture hashes in docs/concept.md (content-derived 64-hex
# unit keys of the worked examples, not credentials; security dossier F-04). Exact values survive
# documentation edits that shift line numbers, which the line-bound fingerprint baseline does not.
regexes = [
  '''2636ec6d366d3cfd50c3e8eafadbb346300fe9d1d7ffb60b6a58e986c070b8cb''',
]
